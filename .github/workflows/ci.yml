name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # current official v4 / v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # current official v2, annotated tag peeled
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint plugin files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  sdk:
    name: Lunixi PHP SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # current official v4 / v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # current official v2, annotated tag peeled
        with:
          php-version: '8.3'
          extensions: sodium, curl, json
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-dev --no-progress --prefer-dist
      - name: Every SDK class the plugin uses exists
        run: php bin/check-sdk-symbols.php
